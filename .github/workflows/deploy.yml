name: Deploy to Spaceship

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: avrilvelasco.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./web/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/v9-tabs-backup.html
            **/index-final-local.html
            **/v5-chrome-glass.html
            **/v6-clean.html
            **/v9-tabs.html
