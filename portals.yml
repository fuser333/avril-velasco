# Portal Scanner — Avril Velasco (Ecuador / LATAM)
# Búsqueda de roles: Community Manager, Marketing Digital, Brand Manager

location_filter:
  always_allow:
    - "Ecuador"
    - "Quito"
    - "Guayaquil"
  allow:
    - "Remote"
    - "Latam"
    - "LATAM"
    - "Latin America"
    - "Ecuador"
    - "Quito"
    - "Guayaquil"
    - "Colombia"
    - "Bogotá"
    - "Medellín"
    - "Perú"
    - "Lima"
    - "México"
    - "CDMX"
    - "Argentina"
    - "Buenos Aires"
    - "Chile"
    - "Santiago"
  block:
    - "India"
    - "Bengaluru"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "Berlin"
    - "France"
    - "Paris"
    - "Singapore"
    - "Japan"
    - "Tokyo"
    - "Australia"
    - "Sydney"
    - "Nigeria"
    - "South Africa"

title_filter:
  positive:
    - "Community Manager"
    - "Marketing Digital"
    - "Digital Marketing"
    - "Brand Manager"
    - "Social Media"
    - "Social Media Manager"
    - "Content Creator"
    - "Content Manager"
    - "Copywriter"
    - "Diseñador"
    - "Diseñadora"
    - "Graphic Designer"
    - "Diseño Gráfico"
    - "Publicista"
    - "Relaciones Públicas"
    - "PR"
    - "Marketing Coordinator"
    - "Marketing Specialist"
    - "Growth"
    - "Growth Marketing"
    - "Performance Marketing"
    - "Influencer"
    - "Creator"
  negative:
    - "Senior Director"
    - "VP"
    - "Vice President"
    - "Chief"
    - "CMO"
    - "CTO"
    - "CEO"
    - "Head of Engineering"
    - "Software Engineer"
    - "Developer"
    - "Programador"
    - "Data Scientist"
    - "Ingeniero"
    - "Engineer"
    - "Analyst"
    - "Sales"
    - "Ventas"
    - "Account Executive"
    - "Customer Support"
    - "Call Center"
    - "Java"
    - "Python"
    - "React"
    - "Angular"

seniority_boost:
  - "Senior"
  - "Lead"
  - "Head"
  - "Manager"

search_queries:
  # LinkedIn Ecuador
  - name: LinkedIn — Ecuador Marketing
    query: 'site:linkedin.com/jobs "Community Manager" OR "Marketing Digital" OR "Social Media Manager" Ecuador'
    enabled: true

  - name: LinkedIn — Colombia Marketing
    query: 'site:linkedin.com/jobs "Community Manager" OR "Marketing Digital" OR "Social Media Manager" Colombia'
    enabled: true

  - name: LinkedIn — Remote LATAM Marketing
    query: 'site:linkedin.com/jobs "Community Manager" OR "Marketing Digital" OR "Brand Manager" remote latam'
    enabled: true

  # Indeed Ecuador
  - name: Indeed — Ecuador
    query: 'site:indeed.com "Community Manager" OR "Marketing Digital" Ecuador'
    enabled: true

  # Computrabajo Ecuador
  - name: Computrabajo — Ecuador
    query: 'site:computrabajo.com.ec "Community Manager" OR "Marketing Digital" OR "Publicista"'
    enabled: true

  # Multiocupas Ecuador
  - name: Multiocupas — Ecuador
    query: 'site:multiocupas.com "Community Manager" OR "Marketing Digital" OR "Diseñador"'
    enabled: true

  # Un Mejor Empleo
  - name: Un Mejor Empleo — Ecuador
    query: 'site:unmejorempleo.com.ec marketing digital community manager'
    enabled: true

  # Glassdoor Ecuador
  - name: Glassdoor — Ecuador Marketing
    query: 'site:glassdoor.com "Community Manager" OR "Marketing Digital" Ecuador'
    enabled: true

